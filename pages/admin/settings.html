<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Settings | ANTOBELL</title>
    <meta name="description" content="Manage ANTOBELL site settings, admin users, and testimonials." />
    <meta name="robots" content="noindex, nofollow" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a'
                        },
                        sand: '#f8fafc',
                        ink: '#0f172a'
                    },
                    boxShadow: {
                        soft: '0 20px 45px -20px rgba(15, 23, 42, 0.28)',
                        glow: '0 12px 40px -18px rgba(59, 130, 246, 0.45)'
                    },
                    backgroundImage: {
                        'admin-shell': 'radial-gradient(circle at top right, rgba(59,130,246,0.14), transparent 22%), radial-gradient(circle at bottom left, rgba(14,165,233,0.12), transparent 18%), linear-gradient(180deg, rgba(248,250,252,1), rgba(255,255,255,1))'
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="../../assets/css/page-loader.css" />
</head>

<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
    <div id="app">
        <div class="page-loader" role="status" aria-label="Loading page">
            <div class="page-loader__content">
                <div class="page-loader__bar"></div>
                <div class="page-loader__grid">
                    <div class="page-loader__block"></div>
                    <div class="page-loader__copy">
                        <div class="page-loader__line page-loader__line--title"></div>
                        <div class="page-loader__line"></div>
                        <div class="page-loader__line page-loader__line--short"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="../../js/admin/settings.js"></script>
</body>

</html>
