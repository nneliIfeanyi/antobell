<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apartment Details | ANTOBELL</title>
    <meta name="description"
        content="Explore apartment details, amenities, reviews, and book your stay with confidence." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a'
                        },
                        ink: '#0f172a'
                    },
                    boxShadow: {
                        soft: '0 20px 45px -20px rgba(15, 23, 42, 0.28)',
                        glow: '0 12px 40px -18px rgba(59, 130, 246, 0.45)'
                    },
                    backgroundImage: {
                        'hero-pattern': 'radial-gradient(circle at top left, rgba(59,130,246,0.22), transparent 32%), radial-gradient(circle at top right, rgba(14,165,233,0.18), transparent 28%), linear-gradient(180deg, rgba(248,250,252,0.92), rgba(255,255,255,1))'
                    },
                    keyframes: {
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(18px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-8px)' }
                        }
                    },
                    animation: {
                        fadeUp: 'fadeUp 0.7s ease-out both',
                        float: 'float 6s ease-in-out infinite'
                    }
                }
            }
        };
    </script>
</head>

<body class="bg-slate-50 text-slate-900 antialiased selection:bg-brand-200 selection:text-brand-900 scroll-smooth">
    <div id="app"></div>
    <script type="module" src="../js/apartment.js"></script>
</body>

</html>
